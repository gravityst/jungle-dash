<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>JungleDash</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name='theme-color' content='#0e2418'>
<style>
body, #status { background-color: #0e2418 !important; }
#status-splash { display: none !important; }
#jd-title { font: 800 clamp(40px, 8vw, 88px)/1 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: 0.08em; color: #f2d16b; text-align: center; margin: 0 16px 28px; }
#jd-hint { font: 500 15px/1.5 'Avenir Next', system-ui, sans-serif; color: #b9cdbf; text-align: center; margin: 22px 16px 0; }
#status-progress { width: min(320px, 70vw); accent-color: #f2d16b; }
#jd-step { font: 500 14px/1.4 'Avenir Next', system-ui, sans-serif; color: #b9cdbf; text-align: center; margin: 14px 16px 0; min-height: 1.4em; }
</style>
<script>
(function () {
	// Render at the screen's real pixel density for crisp output, but cap it at 2x:
	// 3x phones would otherwise push 2.25x the pixels of 2x for no visible gain.
	var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'devicePixelRatio');
	if (!d || !d.configurable && Object.getOwnPropertyDescriptor(window, 'devicePixelRatio')) return;
	Object.defineProperty(window, 'devicePixelRatio', { configurable: true, enumerable: true, get: function () { var r = d.get ? d.get.call(window) : d.value; return Math.min(2, r || 1); } });
})();
document.addEventListener('DOMContentLoaded', function () {
	document.title = 'Jungle Dash';
	var s = document.getElementById('status');
	if (!s) return;
	var t = document.createElement('div');
	t.id = 'jd-title';
	t.textContent = 'JUNGLE DASH';
	s.insertBefore(t, s.firstChild);
	var h = document.createElement('div');
	h.id = 'jd-hint';
	h.textContent = 'Arrow keys or WASD to run, Space to jump. On a phone or tablet, swipe.';
	s.appendChild(h);
	var st = document.createElement('div');
	st.id = 'jd-step';
	var bar = document.getElementById('status-progress');
	s.insertBefore(st, bar ? bar.nextSibling : null);
});
(function () {
	// Shader warm-up. The Compatibility renderer compiles every shader the first frame needs one at a
	// time, inside that frame, while the page sits frozen on the loading screen: about 23 s on a Mac on a
	// first visit and much longer on a phone, which looks like a hang at 100%. jd-shaders.json lists the
	// programs Godot links for that frame. Compiling them here, in a throwaway context, in parallel
	// (KHR_parallel_shader_compile) and while the game downloads, fills the browser's shader cache, so
	// Godot's own compiles become cache hits. Anything missing (no WebGL2, no extension, no file) skips it.
	var NL = String.fromCharCode(10), W = window.jdWarm = { total: 0, done: 0 };
	var recording = location.search.indexOf('record-shaders') >= 0;
	function warm() {
		var gl = document.createElement('canvas').getContext('webgl2', { alpha: false, depth: true, stencil: false, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: true });
		var par = gl && gl.getExtension('KHR_parallel_shader_compile');
		if (!par) return Promise.resolve();
		gl.getSupportedExtensions().forEach(function (e) { gl.getExtension(e); });
		return fetch('jd-shaders.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
			if (!m || m.v !== 1) return;
			var src = m.src.map(function (r) { var out = []; for (var i = 0; i < r.length; i += 2) for (var j = 0; j < r[i + 1]; j++) out.push(m.lines[r[i] + j]); return out.join(NL); });
			var made = [];
			function shader(i, type) { if (!made[i]) { made[i] = gl.createShader(type); gl.shaderSource(made[i], src[i]); gl.compileShader(made[i]); } return made[i]; }
			var progs = m.prog.map(function (p) { var pr = gl.createProgram(); gl.attachShader(pr, shader(p[0], gl.VERTEX_SHADER)); gl.attachShader(pr, shader(p[1], gl.FRAGMENT_SHADER)); gl.linkProgram(pr); return pr; });
			W.total = progs.length;
			return new Promise(function (resolve) {
				(function poll() {
					while (W.done < W.total && !gl.isContextLost() && gl.getProgramParameter(progs[W.done], par.COMPLETION_STATUS_KHR)) W.done++;
					if (W.done >= W.total || gl.isContextLost()) resolve(); else setTimeout(poll, 50);
				})();
			});
		}).then(function () { var l = gl.getExtension('WEBGL_lose_context'); if (l) l.loseContext(); });
	}
	W.ready = recording ? Promise.resolve() : warm().catch(function () {});
	// Hold Godot's start (the frozen part) until the warm-up is done, at most 30 s.
	document.addEventListener('DOMContentLoaded', function () {
		if (typeof engine === 'undefined' || !engine.start) return;
		var start = engine.start;
		engine.start = function () {
			var me = this, args = arguments, step = document.getElementById('jd-step');
			var tick = setInterval(function () { if (step && W.total) step.textContent = 'Warming up the jungle ' + Math.round(100 * W.done / W.total) + '%'; }, 100);
			return Promise.race([W.ready, new Promise(function (r) { setTimeout(r, 30000); })]).then(function () {
				clearInterval(tick);
				if (step) step.textContent = 'Almost there…';
				return new Promise(function (r) { setTimeout(r, 30); });
			}).then(function () { return start.apply(me, args); });
		};
	});
	// Godot's loader never handles a failed WebAssembly compile, so on a phone that runs out of memory the
	// page would sit on the loading screen for ever. Say so instead.
	var wis = WebAssembly.instantiateStreaming;
	if (wis) WebAssembly.instantiateStreaming = function () {
		var p = wis.apply(WebAssembly, arguments);
		p.catch(function (e) {
			var n = document.getElementById('status-notice'), bar = document.getElementById('status-progress');
			if (!n || !document.getElementById('status')) return;
			n.textContent = 'This device could not start the game (' + ((e && e.message) || e) + '). Close other tabs and reload the page.';
			n.style.display = 'block';
			if (bar) bar.style.display = 'none';
		});
		return p;
	};
	if (!recording) return;
	// index.html?record-shaders: record the programs Godot links, then call jdSaveShaders() in the
	// console to download a fresh jd-shaders.json for docs/ (after changing materials or the renderer).
	var progs = new Map(), types = new Map(), srcs = new Map(), att = new Map(), getContext = HTMLCanvasElement.prototype.getContext;
	HTMLCanvasElement.prototype.getContext = function (t) {
		var gl = getContext.apply(this, arguments);
		if (gl && t === 'webgl2' && !gl.jdRec) {
			gl.jdRec = 1;
			['createShader', 'shaderSource', 'attachShader', 'linkProgram'].forEach(function (n) {
				var f = gl[n];
				gl[n] = function (x, y) {
					var r = f.apply(gl, arguments);
					if (n === 'createShader') types.set(r, x);
					else if (n === 'shaderSource') srcs.set(x, y);
					else if (n === 'attachShader') { if (!att.has(x)) att.set(x, []); att.get(x).push(y); }
					else {
						var v = (att.get(x) || []).filter(function (h) { return types.get(h) === gl.VERTEX_SHADER; })[0];
						var fr = (att.get(x) || []).filter(function (h) { return types.get(h) === gl.FRAGMENT_SHADER; })[0];
						if (v && fr) progs.set(srcs.get(v) + String.fromCharCode(0) + srcs.get(fr), [srcs.get(v), srcs.get(fr)]);
					}
					return r;
				};
			});
		}
		return gl;
	};
	window.jdShaderManifest = function () {
		var lineAt = new Map(), lines = [], srcAt = new Map(), src = [], prog = [];
		function add(s) {
			if (srcAt.has(s)) return srcAt.get(s);
			var runs = [];
			s.split(NL).forEach(function (line) {
				var k = lineAt.get(line);
				if (k === undefined) { k = lines.length; lines.push(line); lineAt.set(line, k); }
				var n = runs.length;
				if (n && runs[n - 2] + runs[n - 1] === k) runs[n - 1]++; else runs.push(k, 1);
			});
			srcAt.set(s, src.length); src.push(runs);
			return src.length - 1;
		}
		progs.forEach(function (p) { prog.push([add(p[0]), add(p[1])]); });
		return JSON.stringify({ v: 1, lines: lines, src: src, prog: prog });
	};
	window.jdSaveShaders = function () {
		var a = document.createElement('a');
		a.href = URL.createObjectURL(new Blob([jdShaderManifest()], { type: 'application/json' }));
		a.download = 'jd-shaders.json';
		a.click();
	};
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":47882816,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
